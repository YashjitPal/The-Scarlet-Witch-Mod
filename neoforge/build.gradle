plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def commonDir = rootProject.file('common')

neoForge {
    version = neoforge_version
    def at = new File(commonDir, 'src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.mkdir('runs/client')
            if (project.hasProperty('showcase')) {
                systemProperty('scarlet.showcase', project.property('showcase').toString())
                systemProperty('scarlet.showcase.quit', project.hasProperty('showcaseQuit').toString())
                programArguments.addAll('--width', '1280', '--height', '720')
            }
        }
        data {
            clientData()
            gameDirectory = project.mkdir('runs/data')
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', new File(commonDir, 'src/generated/resources').absolutePath,
                    '--existing', new File(commonDir, 'src/main/resources').absolutePath
            )
        }
        server {
            server()
            gameDirectory = project.mkdir('runs/server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
