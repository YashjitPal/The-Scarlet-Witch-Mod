plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    def aw = rootProject.file("common/src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            if (project.hasProperty('showcase')) {
                vmArg("-Dscarlet.showcase=${project.property('showcase')}")
                vmArg("-Dscarlet.showcase.quit=${project.hasProperty('showcaseQuit')}")
                if (project.hasProperty('showcaseServer')) {
                    vmArg("-Dscarlet.showcase.server=${project.property('showcaseServer')}")
                }
                // a flight recording of the whole run, to see where the time goes: -PshowcaseProfile=<file.jfr>
                if (project.hasProperty('showcaseProfile')) {
                    vmArg("-XX:StartFlightRecording=filename=${project.property('showcaseProfile')},settings=profile,dumponexit=true")
                }
                // films: a world of ordinary land, a player whose default skin is Alex's, at film size
                if (project.hasProperty('showcaseFilm')) {
                    vmArg('-Dscarlet.showcase.world=film')
                    programArgs('--width', '1920', '--height', '1080', '--username', 'Scarlet')
                } else if (project.hasProperty('showcaseSeed')) {
                    // a world of ordinary land grown from someone's own world's seed
                    vmArg("-Dscarlet.showcase.seed=${project.property('showcaseSeed')}")
                    programArgs('--width', '1280', '--height', '720', '--username', 'Showcase')
                } else if (project.hasProperty('showcaseWorld')) {
                    // a copy of a world someone played, in runs/client/saves, played as them: -PshowcaseAs=<name>:<uuid>
                    vmArg("-Dscarlet.showcase.world=${project.property('showcaseWorld')}")
                    def player = project.findProperty('showcaseAs')?.toString()?.split(':')
                    programArgs('--width', '1280', '--height', '720', '--username', player ? player[0] : 'Showcase')
                    if (player && player.length > 1) {
                        programArgs('--uuid', player[1])
                    }
                } else {
                    programArgs('--width', '1280', '--height', '720', '--username', 'Showcase')
                }
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
